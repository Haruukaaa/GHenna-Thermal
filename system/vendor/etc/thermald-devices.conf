# Device description config — optimized for minimal thermal throttling with safe charging
# Disables aggressive cooling (GPU throttle, CPU freq scaling, backlight) while protecting battery

# GPU frequency: DISABLED (def_target:0) — let GPU run at full speed
[
name:gpu
cooling_name:thermal-devfreq-0
def_target:0
select_higher:0
]

# Battery monitor: ACTIVE but conservative — tracks temp, does NOT throttle
[
name:battery
cooling_name:battery
def_target:0
select_higher:0
]

# Backlight panel: DISABLED — keep display brightness constant
[
name:backlight
cooling_name:panel0-backlight
def_target:0
select_higher:0
]

# Charger limit: SMART charging control — throttles charging when battery is hot
# Reduces charge current to protect battery health under thermal stress
[
name:charger_limit
cooling_name:charger
def_target:0
select_higher:1
]

# Battery thermal sensor — monitors battery temperature in real-time
# Does NOT trigger aggressive cooling; only informs charging logic
[
name:battery_temp
path:/sys/class/thermal/thermal_zone0/temp
cooling_name:battery
def_target:0
select_higher:0
]

# CPU frequency scaling: DISABLED (def_target:0) — CPU runs at max frequency
[
name:cpufreq_scaling
cooling_name:cpufreq
def_target:0
select_higher:0
]

# Critical temperature failsafe — only engages if battery exceeds critical threshold (e.g., >60°C)
# This is a LAST RESORT protection mechanism to prevent hardware damage
[
name:critical_thermal_protect
path:/sys/class/thermal/thermal_zone1/temp
cooling_name:battery
def_target:0
select_higher:1
]

# CONFIGURATION NOTES:
# ─────────────────────────────────────────────────────────────────
# THERMAL THROTTLING: DISABLED
#   • GPU, CPU freq scaling, and backlight cooling are set to def_target:0 (off)
#   • Device will NOT throttle performance under normal thermal conditions
#   • Provides best performance and user experience
#
# CHARGING PROTECTION: SMART
#   • Charger limit actively monitors battery temperature
#   • Reduces charge current when battery temp rises (select_higher:1)
#   • Conservative battery management (select_higher:0 for monitoring)
#   • Charging is throttled intelligently, NOT performance
#
# PATH PLACEHOLDERS:
#   • Replace /sys/class/thermal/thermal_zone0/temp with actual battery temp sensor
#   • Replace /sys/class/thermal/thermal_zone1/temp with critical temp sensor
#   • Run: grep -r "battery_temp\|batt_temp" /sys/class/thermal/ to find correct paths
#
# TO ENABLE CRITICAL SAFETY:
#   • Keep charger_limit and battery_temp active
#   • Adjust def_target in charger_limit based on testing (0=off, 1=light limit, 2+=heavy)
#   • Set select_higher:1 to allow thermald to increase cooling when needed
#
# RELOAD CHANGES:
#   • After editing, run: systemctl restart thermald
#   • Or reboot device for changes to take effect
