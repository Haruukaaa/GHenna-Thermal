# ───────────────────────────────────────────────────────────────
# THERMAL + CHARGING MANAGEMENT CONFIGURATION
# Optimized for performance with safe charging and critical failsafe
# ───────────────────────────────────────────────────────────────

# GPU cooling: enabled for thermal management
[
name:gpu
cooling_name:thermal-devfreq-0
def_target:0
select_higher:1
]

# CPU frequency scaling: enabled for thermal management
[
name:cpufreq_scaling
cooling_name:cpufreq
def_target:0
select_higher:1
]

# Backlight cooling: disabled (constant brightness)
[
name:backlight
cooling_name:panel0-backlight
def_target:0
select_higher:0
]

# Battery monitor: active, with throttling
[
name:battery
cooling_name:battery
def_target:0
select_higher:1
]

# Charger limit: smart charging control
# Reduces charge current when battery temp rises
[
name:charger_limit
cooling_name:charger
def_target:1
select_higher:1
]

# Charger high limit: aggressive throttling for high temp
[
name:charger_high
cooling_name:charger
def_target:2
select_higher:1
]

# Global thermal disable target: keep devices at nominal thermal state
# Use this only when you want to avoid active thermal state escalation.
[
name:all_device_thermal_disable
cooling_name:thermal
def_target:0
select_higher:0
]

# Battery thermal sensor: moderate charger throttling at 50°C
# Replace path with actual battery sensor
[
name:battery_temp
path:/sys/class/thermal/thermal_zone0/temp
cooling_name:charger
def_target:1
select_higher:1
]

# Critical thermal failsafe: last-resort charger cutoff at 60°C
# Replace path with actual critical sensor
[
name:critical_thermal_protect
path:/sys/class/thermal/thermal_zone1/temp
cooling_name:charger
def_target:2
select_higher:1
]

# Charger reset: full charge when device cools back below threshold
[
name:charger_reset
cooling_name:charger
def_target:0
select_higher:0
]

# ───────────────────────────────────────────────────────────────
# CONFIGURATION NOTES
# • GPU, CPU cooling enabled → thermal management
# • Backlight cooling disabled → constant brightness
# • Charger_limit active → throttles charging when battery temp rises
# • Charger_high active → aggressive throttling at high temps
# • Battery_temp monitors and throttles
# • Critical_thermal_protect engages only at dangerous temps (>60°C)
# • Charger_reset enables full charge when cool
#
# PATHS:
# • Replace /sys/class/thermal/thermal_zone0/temp with battery sensor
# • Replace /sys/class/thermal/thermal_zone1/temp with critical sensor
# • Run: grep -r "battery_temp\|batt_temp" /sys/class/thermal/
#
# SAFETY:
# • Charger_limit def_target:1 → light throttling
# • Charger_high def_target:2 → heavy throttling
# • Battery_temp def_target:1 → charger reduced to moderate speed around 50°C
# • Critical_thermal_protect def_target:2 → charger cutoff at or above 60°C
# • Charger_reset def_target:0 → full charge when cool
#
# RELOAD:
# • systemctl restart thermald
# • Or reboot device
# ───────────────────────────────────────────────────────────────
