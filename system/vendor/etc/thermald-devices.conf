# Device description config
# Improved configuration with charger-limit and thermal entries.
# Adjust `cooling_name` and `path` values to match your kernel/sysfs nodes.

# GPU frequency cooling (reduced to prevent thermal runaway)
[
name:gpu
cooling_name:thermal-devfreq-0
def_target:1
select_higher:1
]

# Battery generic cooling (monitor/control) - default to level 1 for battery protection
[
name:battery
cooling_name:battery
def_target:1
select_higher:0
]

# Backlight panel cooling - reduce display brightness on thermal stress
[
name:backlight
cooling_name:panel0-backlight
def_target:1
select_higher:1
]

# temp_state (platform-specific state reader)
[
name:temp_state
path:/sys/class/thermal/thermal_message/temp_state
def_target:0
select_higher:1
]

# Charger limit: used to reduce/stop charging when thermal policy requests it.
# Ensure the kernel exposes a cooling device that controls charging (common names:
#  "battery", "charger", "battery-charging", or platform-specific). If your
# kernel uses a sysfs node to set a charge limit, set the `cooling_name` to the
# corresponding cooling device. If unsure, keep `cooling_name:battery` and test.
[
name:charge_limit
cooling_name:charger
def_target:1
select_higher:1
]

# Per-battery temperature sensor (example). Replace thermal_zoneX with the
# correct zone for your battery temp sensor if available.
[
name:battery_temp
path:/sys/class/thermal/thermal_zoneX/temp
cooling_name:battery
def_target:0
select_higher:1
]

# CPU thermal zone: reduces CPU freq or triggers cooling when hot.
# Replace thermal_zoneY with the correct CPU thermal zone on your device.
[
name:cpu_thermal
path:/sys/class/thermal/thermal_zoneY/temp
cooling_name:cpufreq
def_target:1
select_higher:1
]

# CPU frequency scaling: aggressively reduce CPU speed under thermal stress
[
name:cpufreq_scaling
cooling_name:cpufreq
def_target:2
select_higher:1
]

# Skin / chassis temperature sensor (if available). Replace thermal_zoneZ.
[
name:skin_temp
path:/sys/class/thermal/thermal_zoneZ/temp
cooling_name:skin
def_target:0
select_higher:1
]

# USB/adapter temperature (optional) — helps limit charging from adapter.
[
name:usb_adapter_temp
path:/sys/class/thermal/thermal_zoneA/temp
cooling_name:usb-therm
def_target:0
select_higher:1
]

# NOTES:
# - `def_target` is the default target index for the cooling device (0 = off, 1+ = active cooling).
# - `select_higher:1` means thermald will choose higher cooling state when needed.
# - `select_higher:0` means thermald only decreases cooling state (conservative charging).
# - Default target set to 1 for most devices to enable passive cooling and protect battery.
# - Charger cooling uses aggressive strategy (select_higher:1) to prevent overcharging during thermal stress.
# - Replace thermal_zone placeholders (X/Y/Z/A) and `cooling_name` values to match
#   your device's kernel thermal/cooling device names. After editing, reload
#   thermald or reboot for changes to take effect.
# OPTIMIZATION SUMMARY:
#   • Battery protection enabled with default cooling level 1
#   • CPU frequency scaling actively throttles under thermal stress
#   • Charger limits current when temps rise (battery health)
#   • GPU and display brightness adapt to thermal conditions
